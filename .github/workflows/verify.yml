name: Verify
on:
  pull_request:
  push:
    branches: [main, master]
permissions:
  contents: read
concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Build packages and check server types
        run: npm run typecheck:edge
      - name: Check workspace types
        run: npm run typecheck
      - name: Run engine, bot, mobile, server and PostgreSQL tests
        run: npm test
      - name: Run isolated PostgreSQL concurrency checks
        run: PG_BIN="$(pg_config --bindir)" npm run test:concurrency
      - name: Check committed shared builds match source
        run: git diff --exit-code -- packages/engine/dist packages/bot/dist
