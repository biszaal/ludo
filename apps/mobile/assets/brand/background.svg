<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
<defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="75%">
      <stop offset="0%" stop-color="#4C8DFF"/>
      <stop offset="50%" stop-color="#2E62E8"/>
      <stop offset="100%" stop-color="#1B3FA6"/>
    </radialGradient>
    <linearGradient id="dieFace" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="70%" stop-color="#F2F5FB"/>
      <stop offset="100%" stop-color="#D8E0EE"/>
    </linearGradient>
    <linearGradient id="red" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FF6B77"/>
      <stop offset="45%" stop-color="#FF4757"/>
      <stop offset="100%" stop-color="#C21830"/>
    </linearGradient>
    <linearGradient id="yellow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFE066"/>
      <stop offset="45%" stop-color="#FFC93C"/>
      <stop offset="100%" stop-color="#EE8E00"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5CE68C"/>
      <stop offset="45%" stop-color="#2ED573"/>
      <stop offset="100%" stop-color="#14913F"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6FA9FF"/>
      <stop offset="45%" stop-color="#3E8BFF"/>
      <stop offset="100%" stop-color="#1D5AD6"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFF3A0"/>
      <stop offset="40%" stop-color="#FFDD45"/>
      <stop offset="100%" stop-color="#FFA400"/>
    </linearGradient>
    <linearGradient id="crownGold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFEB70"/>
      <stop offset="100%" stop-color="#F5A100"/>
    </linearGradient>
    <!-- cartoon pawn silhouette, base sits at y=0, ~300 tall -->
    <path id="pawn" d="M -63,-196
      A 64 64 0 1 1 63,-196
      C 52,-152 32,-134 26,-120
      C 62,-96 80,-58 88,-34
      L 92,-26
      A 92 26 0 0 1 -92,-26
      L -88,-34
      C -80,-58 -62,-96 -26,-120
      C -32,-134 -52,-152 -63,-196 Z"/>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#0B1E52" flood-opacity="0.45"/>
    </filter>
  </defs>
<rect width="1024" height="1024" fill="url(#bg)"/>
<g transform="translate(512,470)" opacity="0.07" fill="#FFFFFF">
    <g id="rays">
      <path d="M0,0 L-100,-820 L100,-820 Z"/>
      <path d="M0,0 L-100,-820 L100,-820 Z" transform="rotate(30)"/>
      <path d="M0,0 L-100,-820 L100,-820 Z" transform="rotate(60)"/>
      <path d="M0,0 L-100,-820 L100,-820 Z" transform="rotate(90)"/>
      <path d="M0,0 L-100,-820 L100,-820 Z" transform="rotate(120)"/>
      <path d="M0,0 L-100,-820 L100,-820 Z" transform="rotate(150)"/>
      <path d="M0,0 L-100,-820 L100,-820 Z" transform="rotate(180)"/>
      <path d="M0,0 L-100,-820 L100,-820 Z" transform="rotate(210)"/>
      <path d="M0,0 L-100,-820 L100,-820 Z" transform="rotate(240)"/>
      <path d="M0,0 L-100,-820 L100,-820 Z" transform="rotate(270)"/>
      <path d="M0,0 L-100,-820 L100,-820 Z" transform="rotate(300)"/>
      <path d="M0,0 L-100,-820 L100,-820 Z" transform="rotate(330)"/>
    </g>
  </g>
<!-- sparkles -->
  <g fill="#FFFFFF">
    <circle cx="160" cy="200" r="8" opacity="0.7"/>
    <circle cx="880" cy="160" r="6" opacity="0.6"/>
    <circle cx="920" cy="420" r="9" opacity="0.5"/>
    <circle cx="110" cy="520" r="6" opacity="0.5"/>
    <circle cx="830" cy="640" r="5" opacity="0.4"/>
  </g>
</svg>